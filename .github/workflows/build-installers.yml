name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    name: Linux .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian package
        run: ./scripts/build-linux-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: finnvnoi-api-check-linux
          path: dist/*.deb

  windows:
    name: Windows .msi
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix
      - name: Build MSI
        shell: pwsh
        run: .\scripts\build-windows-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: finnvnoi-api-check-windows
          path: dist/*.msi

  macos:
    name: macOS .pkg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build PKG
        run: ./scripts/build-macos-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: finnvnoi-api-check-macos
          path: dist/*.pkg

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: finnvnoi-api-check-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-files/* --generate-notes
